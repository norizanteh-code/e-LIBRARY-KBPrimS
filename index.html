<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>e-LIBRARY • SK Kampung Baru Kuala Abang</title>
<style>
:root{--p:#172b91;--p2:#2848c7;--a:#f5c400;--bg:#f5f7fb;--ink:#172033;--muted:#64748b;--card:#fff;--line:#e5e7eb;--ok:#15803d;}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#101d69,#273fa8 55%,#f5c400)}
.loginbox{width:min(430px,100%);background:#fff;border-radius:28px;padding:34px;box-shadow:0 25px 80px #0004;text-align:center}
.loginbox img{width:105px;height:105px;object-fit:contain;margin-bottom:8px}.loginbox h1{font-size:23px;margin:5px 0}.loginbox p{color:var(--muted);font-size:13px}
.loginbox input{width:100%;padding:14px;border:1px solid var(--line);border-radius:13px;margin:12px 0;outline:0;text-align:center;letter-spacing:1px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
.error{color:#b91c1c;font-size:12px;min-height:18px}
header{position:sticky;top:0;z-index:10;background:#fffffff2;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{max-width:1180px;margin:auto;padding:11px 20px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;color:var(--p)}.brand img{width:52px;height:52px;object-fit:contain}.brand small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.container{max-width:1180px;margin:auto;padding:28px 20px 60px}
.hero{border-radius:28px;padding:38px;color:#fff;background:linear-gradient(135deg,#101d69,#293fb0);display:grid;grid-template-columns:1.3fr .7fr;gap:25px;overflow:hidden}
.hero h2{font-size:clamp(30px,5vw,50px);line-height:1.04;margin:10px 0}.hero p{color:#dbe4ff;line-height:1.7}
.hero img{width:190px;max-width:100%;height:190px;object-fit:contain;filter:drop-shadow(0 15px 25px #0004);justify-self:center}
.section{margin-top:30px}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.topline h2{margin:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.book{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 8px 25px #1720330c}
.cover{height:220px;background:#eaf0ff;color:#fff;display:flex;align-items:flex-end;position:relative;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover;display:block}.cover .cover-fallback{position:absolute;inset:0;padding:22px;background:linear-gradient(145deg,#142878,#3155d1);display:flex;align-items:flex-end}.cover h3{margin:0;font-size:21px;max-width:75%;text-shadow:0 2px 6px #0008}.bookbody{padding:16px}
.profile{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:22px}.profilegrid{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.stat b{font-size:25px;display:block}.classgroup{border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:12px;background:#fff}.classgroup h3{margin:0 0 10px}.studentrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.studentrow:first-of-type{border-top:0}.muted{color:var(--muted)}
.dashboard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}.record{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.ok{color:var(--ok);font-weight:800}
.modal{position:fixed;inset:0;background:#0f172acc;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px}.box{background:#fff;border-radius:23px;width:min(900px,100%);max-height:94vh;overflow:auto}.head{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:2}.close{border:0;background:#eef2f7;border-radius:50%;width:38px;height:38px;font-size:20px}
.reader{padding:22px}.bar{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#1e40af,#f5c400);width:0}
.page{min-height:420px;background:#fffdf6;border:1px solid #eee6ce;border-radius:17px;padding:45px;display:flex;flex-direction:column;justify-content:center}.page h3{text-align:center;font-family:Georgia,serif;font-size:28px}.page p{font-family:Georgia,serif;font-size:18px;line-height:2.05;white-space:pre-line}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:15px;gap:10px}
.secondary{border:1px solid var(--line);background:#fff;padding:11px 15px;border-radius:11px}.form{padding:22px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:800}.field input,.field textarea,.field select{padding:12px;border:1px solid var(--line);border-radius:11px;background:#fafafa}textarea{min-height:110px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.notice{padding:13px;background:#ecfdf5;color:#166534;border-radius:12px;font-weight:800;margin-bottom:15px}
footer{padding:30px;text-align:center;color:var(--muted);font-size:12px}
@media(max-width:800px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.grid,.formgrid,.profilegrid,.stats{grid-template-columns:1fr}.field.full{grid-column:auto}.page{padding:25px;min-height:390px}.hero{padding:27px}}
.ainsmode{padding:20px}.ainsintro{background:#eef4ff;border:1px solid #cbd8ff;border-radius:15px;padding:14px;margin-bottom:15px}
.security-note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:10px}
.class-folder{border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden;background:#fff}
</style>
</head>
<body>

  <!-- LOGIN BOX -->
  <div id="loginPage" class="login">
    <div class="loginbox">
      <img src="https://placeholder.com" alt="Logo">
      <h1>e-LIBRARY</h1>
      <p>SK Kampung Baru Kuala Abang</p>
      <div style="margin:20px 0; text-align:left;">
        <label style="font-size:12px; font-weight:bold;">Nama Murid Berdaftar</label>
        <select id="loginStudentName" style="width:100%; padding:12px; margin:8px 0; border-radius:10px; border:1px solid var(--line);">
          <option value="">-- Pilih nama murid --</option>
          <option value="Ahmad">Ahmad</option>
        </select>
        <label style="font-size:12px; font-weight:bold;">Kelas</label>
        <select id="loginClass" style="width:100%; padding:12px; margin:8px 0; border-radius:10px; border:1px solid var(--line);">
          <option value="">-- Pilih kelas --</option>
          <option value="6 Cerdik">6 Cerdik</option>
        </select>
      </div>
      <div id="loginError" class="error"></div>
      <button class="btn" onclick="prosesMasuk()" style="width:100%;">Masuk</button>
    </div>
  </div>

  <!-- MAIN DASHBOARD -->
  <div id="mainApp" class="hidden">
    <header>
      <div class="nav">
        <div class="brand">e-LIBRARY <small>SKKB</small></div>
        <button class="secondary" onclick="logKeluar()">LOGOUT</button>
      </div>
    </header>
    <div class="container">
      <div class="hero">
        <div>
          <h2>Jom Baca, Jom Isi AINS!</h2>
          <p>Baca e-buku sehingga selesai dan isi maklumat bacaan ke sistem AINS.</p>
        </div>
      </div>
      <div class="section">
        <h2>📚 Koleksi E-Buku</h2>
        <div id="bookGrid" class="grid"></div>
      </div>
    </div>
  </div>

  <!-- SYSTEM FUNCTIONS (SCRIPT) -->
  <script>
    function prosesMasuk() {
      let nama = document.getElementById('loginStudentName').value;
      let kelas = document.getElementById('loginClass').value;
      if(!nama || !kelas) {
        document.getElementById('loginError').innerText = "Sila lengkapkan pilihan.";
        return;
      }
      document.getElementById('loginPage').classList.add('hidden');
      document.getElementById('mainApp').classList.remove('hidden');
      paparkanBuku();
    }
    function logKeluar() {
      document.getElementById('mainApp').classList.add('hidden');
      document.getElementById('loginPage').classList.remove('hidden');
    }
    function paparkanBuku() {
      let grid = document.getElementById('bookGrid');
      grid.innerHTML = `
        <div class="book">
          <div class="cover"><div class="cover-fallback"><h3>Buku Contoh</h3></div></div>
          <div class="bookbody">
            <button class="btn" onclick="alert('Membuka Buku...')">Baca Buku</button>
          </div>
        </div>`;
    }
  </script>
</body>
</html>
